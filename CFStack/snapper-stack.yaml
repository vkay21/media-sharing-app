AWSTemplateFormatVersion: "2010-09-09"
Description: Snapper media sharing application using EC2, S3, DynamoDB, and CloudFormation

Parameters:
  BucketName:
    Type: String
    Default: snap-media-bucket-7944

  TableName:
    Type: String
    Default: Data_image

  GitHubRepo:
    Type: String
    Default: https://github.com/vkay21/media-sharing-app.git

Resources:
  SnapperVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: SnapperVPC

  SnapperInternetGateway:
    Type: AWS::EC2::InternetGateway

  SnapperGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref SnapperVPC
      InternetGatewayId: !Ref SnapperInternetGateway

  SnapperPublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SnapperVPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: SnapperPublicSubnet

  SnapperRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref SnapperVPC

  SnapperPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: SnapperGatewayAttachment
    Properties:
      RouteTableId: !Ref SnapperRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref SnapperInternetGateway

  SnapperSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SnapperPublicSubnet
      RouteTableId: !Ref SnapperRouteTable

  SnapperSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow Snapper web and SSH access
      VpcId: !Ref SnapperVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0

        - IpProtocol: tcp
          FromPort: 5000
          ToPort: 5000
          CidrIp: 0.0.0.0/0

      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  SnapperBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  SnapperBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SnapperBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadForSnapperImages
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub arn:aws:s3:::${BucketName}/*

  SnapperDynamoDBTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: image_id
          AttributeType: S
      KeySchema:
        - AttributeName: image_id
          KeyType: HASH

  SnapperEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t2.micro
      ImageId: ami-0c02fb55956c7d316
      SubnetId: !Ref SnapperPublicSubnet
      SecurityGroupIds:
        - !Ref SnapperSecurityGroup
      IamInstanceProfile: LabInstanceProfile
      Tags:
        - Key: Name
          Value: SnapperEC2
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash -xe
          exec > /var/log/user-data.log 2>&1

          yum -y update
          yum -y install git python3 python3-pip

          cd /home/ec2-user
          rm -rf snapper
          git clone ${GitHubRepo} snapper
          cd snapper

          cat > .env <<EOF
          S3_BUCKET_NAME=${BucketName}
          DYNAMODB_TABLE_NAME=${TableName}
          AWS_REGION=${AWS::Region}
          EOF

          pip3 install --upgrade pip
          pip3 install Flask boto3 Pillow python-dotenv

          chown -R ec2-user:ec2-user /home/ec2-user/snapper

          cat > /etc/systemd/system/snapper.service <<EOF
          [Unit]
          Description=Snapper Media Sharing Flask App
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          WorkingDirectory=/home/ec2-user/snapper
          EnvironmentFile=/home/ec2-user/snapper/.env
          ExecStart=/usr/bin/python3 /home/ec2-user/snapper/app.py
          Restart=always
          RestartSec=10
          User=ec2-user

          [Install]
          WantedBy=multi-user.target
          EOF

          systemctl daemon-reload
          systemctl enable snapper
          systemctl start snapper

Outputs:
  SnapperURL:
    Description: Snapper application URL
    Value: !Sub http://${SnapperEC2Instance.PublicIp}:5000

  EC2PublicIP:
    Description: Public IP address of Snapper EC2 instance
    Value: !GetAtt SnapperEC2Instance.PublicIp

  BucketNameOutput:
    Description: S3 bucket for images and thumbnails
    Value: !Ref SnapperBucket

  DynamoDBTableNameOutput:
    Description: DynamoDB table for image metadata
    Value: !Ref SnapperDynamoDBTable